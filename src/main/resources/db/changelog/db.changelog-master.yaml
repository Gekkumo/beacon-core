databaseChangeLog:
  - changeSet:
      id: 1
      author: Gekkumo
      changes:
        - createTable:
            tableName: events
            columns:
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: aggregate_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: received_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: source
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: actor_id
                  type: VARCHAR(255)
              - column:
                  name: actor_type
                  type: VARCHAR(50)
              - column:
                  name: actor_name
                  type: VARCHAR(255)
              - column:
                  name: ip_address
                  type: VARCHAR(45)
              - column:
                  name: user_agent
                  type: VARCHAR(500)
              - column:
                  name: changes
                  type: JSONB
              - column:
                  name: context
                  type: JSONB
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: "SUCCESS"
              - column:
                  name: trace_id
                  type: VARCHAR(64)
              - column:
                  name: geoip_country
                  type: VARCHAR(2)
              - column:
                  name: geoip_city
                  type: VARCHAR(255)

        - createIndex:
            tableName: events
            indexName: idx_events_aggregate
            columns:
              - column:
                  name: aggregate_id
              - column:
                  name: occurred_at

        - createIndex:
            tableName: events
            indexName: idx_events_type
            columns:
              - column:
                  name: event_type

        - createIndex:
            tableName: events
            indexName: idx_events_occurred
            columns:
              - column:
                  name: occurred_at

        - createIndex:
            tableName: events
            indexName: idx_events_trace
            columns:
              - column:
                  name: trace_id

        - createIndex:
            tableName: events
            indexName: idx_events_actor
            columns:
              - column:
                  name: actor_id