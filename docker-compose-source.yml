name: beacon-source

services:
  source-postgres-1:
    image: postgres:18.4-alpine3.23
    container_name: source-postgres-1
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: source_user
      POSTGRES_PASSWORD: source_password
      POSTGRES_DB: service_a
    volumes:
      - ${PWD}/.docker-data/source-postgres-1:/var/lib/postgresql
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U source_user -d service_a" ]
      interval: 5s
      timeout: 5s
      retries: 5
    command: >
      postgres 
      -c wal_level=logical
      -c max_replication_slots=10 
      -c max_wal_senders=10
      -c max_connections=100