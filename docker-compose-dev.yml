name: beacon

services:
  # PostgreSQL
  postgres:
    image: postgres:18.4-alpine3.23
    container_name: beacon-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beacon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beacon}
      POSTGRES_DB: ${POSTGRES_DB:-beacon}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beacon} -d ${POSTGRES_DB:-beacon}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beacon-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Kafka
  kafka:
    image: apache/kafka:4.3.0
    container_name: beacon-kafka
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - beacon-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: beacon-kafka-ui
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_JMXPORT: 9997
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - beacon-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'

  # Debezium Connect
  debezium:
    image: debezium/connect:2.7.3.Final
    container_name: beacon-debezium
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: beacon-debezium-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: false
      VALUE_CONVERTER_SCHEMAS_ENABLE: false
      CONNECT_REST_ADVERTISED_HOST_NAME: debezium
      CONNECT_PLUGIN_PATH: /kafka/connect
    volumes:
      - ./plugins:/kafka/connect/plugins
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 10s
      retries: 10
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - beacon-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Redis
  valkey:
    image: valkey/valkey:9.1.0-alpine3.23
    container_name: beacon-valkey
    ports:
      - "127.0.0.1:6379:6379"
    command: valkey-server --requirepass ${VALKEY_PASSWORD:-beacon} --save 60 1 --loglevel warning
    volumes:
      - valkey_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a ${VALKEY_PASSWORD:-beacon} ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - beacon-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
    profiles:
      - with-cache

# Volumes
volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local
  valkey_data:
    driver: local

# Networks
networks:
  beacon-network:
    driver: bridge
    name: beacon-network