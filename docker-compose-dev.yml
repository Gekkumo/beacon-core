name: beacon

services:
  beacon-postgres:
    image: postgres:18.4-alpine3.23
    container_name: beacon-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PWD}/.docker-data/postgres:/var/lib/postgresql
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  beacon-kafka:
    image: apache/kafka:4.3.0
    container_name: beacon-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://beacon-kafka:9092,EXTERNAL://localhost:9094'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@beacon-kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - ${PWD}/.docker-data/kafka:/var/lib/kafka/data
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.1 9092 || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: beacon-kafka-forwarder
    command: "TCP-LISTEN:9094,fork,reuseaddr TCP-CONNECT:beacon-kafka:9094"
    ports:
      - "127.0.0.1:9094:9094"
    restart: always
    depends_on:
      beacon-kafka:
        condition: service_healthy

  debezium-connect:
    image: debezium/connect:2.7.3.Final
    container_name: beacon-debezium-connect
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      BOOTSTRAP_SERVERS: beacon-kafka:9092
      GROUP_ID: beacon-debezium-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: false
      VALUE_CONVERTER_SCHEMAS_ENABLE: false
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/" ]
      interval: 10s
      timeout: 10s
      retries: 10
    depends_on:
      beacon-kafka:
        condition: service_healthy

  source-postgres:
    image: postgres:18.4-alpine3.23
    container_name: source-postgres
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: source_user
      POSTGRES_PASSWORD: source_password
      POSTGRES_DB: service_a
    volumes:
      - ${PWD}/.docker-data/source-postgres:/var/lib/postgresql
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U source_user -d service_a" ]
      interval: 5s
      timeout: 5s
      retries: 5
    command: >
      postgres 
      -c wal_level=logical
      -c max_replication_slots=10 
      -c max_wal_senders=10
      -c max_connections=100

  telemetrygen:
    image: otel/opentelemetry-collector-contrib:0.154.0
    container_name: beacon-telemetrygen
    command: >
      telemetrygen traces
      --otlp-endpoint beacon-core:4318
      --otlp-insecure
      --duration 3600s
      --rate 10
    depends_on:
      beacon-core:
        condition: service_started
    restart: no

